services:
  postgres:
    image: postgres:16-alpine
    container_name: messenger-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=messenger
      - POSTGRES_PASSWORD=messenger_password
      - POSTGRES_DB=messenger_db
    ports:
      # Port 5432 may be used by another local Postgres container.
      - "15432:5432"
    volumes:
      - messenger_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-messenger} -d ${POSTGRES_DB:-messenger_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: messenger-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - messenger_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio:latest
    container_name: messenger-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-messenger_minio}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:-messenger_minio_password}"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - messenger_minio_data:/data
  api:
    image: messenger-api:latest
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: messenger-api
    restart: unless-stopped
    environment:
      APP_NAME: "Messenger App API"
      APP_ENV: "production"
      DEBUG: "false"
      API_V1_PREFIX: "/api/v1"
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-messenger}:${POSTGRES_PASSWORD:-messenger_password}@postgres:5432/${POSTGRES_DB:-messenger_db}"
      REDIS_URL: "redis://redis:6379/0"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-local-docker-secret-change-before-deployment-4f19d620}"
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000}"
      CORS_ORIGIN_REGEX: "${CORS_ORIGIN_REGEX:-^https?://(localhost|127\\.0\\.0\\.1)(:\\d+)?$}"
      MAX_UPLOAD_SIZE_MB: "10"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-messenger_minio}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-messenger_minio_password}"
      MINIO_BUCKET: "${MINIO_BUCKET:-messenger-media}"
      MINIO_SECURE: "false"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/v1/auth/google/callback}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:3000}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-gemma4:latest}"
      OLLAMA_TIMEOUT_SECONDS: "${OLLAMA_TIMEOUT_SECONDS:-120}"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5
  web:
    image: messenger-web:latest
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/api/v1/ws}
    container_name: messenger-web
    restart: unless-stopped
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5
volumes:
  messenger_postgres_data:
  messenger_redis_data:
  messenger_minio_data:
