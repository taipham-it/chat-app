[project]
name = "messenger-api"
version = "0.1.0"
description = "FastAPI backend for the Messenger-style chat app"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "asyncpg>=0.30",
  "bcrypt>=4.2",
  "email-validator>=2.2",
  "fastapi>=0.115",
  "httpx>=0.28",
  "minio>=7.2.0",
  "pydantic-settings>=2.7",
  "python-multipart>=0.0.20",
  "pyjwt>=2.10",
  "redis>=5.2",
  "sqlalchemy>=2.0.36",
  "uvicorn>=0.34",
  "websockets>=14",
]

[dependency-groups]
dev = ["mypy>=1.14", "pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
